# TahoQuickShop - independently implemented shop configuration.
# No commands are registered in this initial build.
settings:
  title: "&8Shop"
  rows: 3
  filler:
    enabled: false
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  purchase:
    close-after-purchase: false
  navigation:
    back-material: RED_STAINED_GLASS_PANE
    back-name: "&cBack"
    next-material: ARROW
    next-name: "&aNext page"
    previous-name: "&cPrevious page"
  messages:
    no-permission: "&cYou don't have permission to use this shop."
    economy-missing: "&cAn economy provider is not available."
    not-enough: "&cYou don't have enough money."
    inventory-full: "&cYour inventory is full!"
    purchase-success: "&aPurchased &e%amount%x %item% &afor &e$%price%&a."
    purchase-failed: "&cPurchase failed. Please try again."
