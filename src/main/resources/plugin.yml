name: TahoQuickShop
version: 1.0.0
main: com.taho.quickshop.TahoQuickShop
api-version: '1.21'
author: Taho
description: Configurable GUI shop plugin with Vault economy support.
softdepend: [Vault, PlayerPoints, ExcellentEconomy]
commands:
  shop:
    description: Opens the TahoQuickShop GUI.
    usage: /shop | /shop reload | /shop add <category>
permissions:
  tahoquickshop.use:
    description: Allows opening the shop GUI.
    default: true
  tahoquickshop.admin:
    description: Allows shop administration features.
    default: op
